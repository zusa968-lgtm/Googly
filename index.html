<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Googly</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8f9fa;
  color:#202124;
}
header{
  padding:20px;
  text-align:center;
  background:white;
  border-bottom:1px solid #ddd;
}
.logo{
  font-size:38px;
  font-weight:bold;
}
.logo span:nth-child(1){color:#4285f4}
.logo span:nth-child(2){color:#ea4335}
.logo span:nth-child(3){color:#fbbc05}
.logo span:nth-child(4){color:#4285f4}
.logo span:nth-child(5){color:#34a853}
main{
  min-height:75vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 18px;
}
.card{
  width:100%;
  max-width:500px;
  background:white;
  padding:35px 25px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}
h1{font-size:30px;margin:10px 0}
p{color:#5f6368;line-height:1.8}
.buttons{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:25px;
}
button{
  border:0;
  padding:14px 25px;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}
.login{background:#4285f4;color:white}
.signup{background:#34a853;color:white}
footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>y</span>
  </div>
</header>

<main>
  <div class="card">
    <h1>مرحبًا بك في Googly</h1>
    <p>
      منصة بسيطة وسريعة وآمنة.
      أنشئ حسابك وابدأ باستخدام Googly.
    </p>

    <div class="buttons">
      <button class="login" onclick="alert('صفحة تسجيل الدخول قيد التجهيز')">
        تسجيل الدخول
      </button>

      <button class="signup" onclick="alert('صفحة إنشاء الحساب قيد التجهيز')">
        إنشاء حساب
      </button>
    </div>
  </div>
</main>

<footer>
  Googly مشروع مستقل وغير تابع لشركة Google.
</footer>

</body>
  </html>
